name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test

  build:
    name: Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run build
        env:
          DATABASE_URL: 'file:./test.db'
          AUTH_SECRET: 'test-secret-key-minimum-32-characters-long'

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run prisma:generate
      - run: npx playwright install --with-deps
      - run: npm run db:push
        env:
          DATABASE_URL: 'file:./test.db'
      - run: npm run db:seed
        env:
          DATABASE_URL: 'file:./test.db'
          AUTH_SECRET: 'test-secret-key-minimum-32-characters-long'
          SEED_ADMIN_USERNAME: 'admin'
          SEED_ADMIN_PASSWORD: 'test-password'
          SEED_ADMIN_EMAIL: 'admin@test.com'
          SEED_ADMIN_DISPLAY_NAME: 'Test Admin'
      - run: npm run dev &
        env:
          DATABASE_URL: 'file:./test.db'
          AUTH_SECRET: 'test-secret-key-minimum-32-characters-long'
      - run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: 'http://127.0.0.1:3000'
          E2E_ADMIN_USERNAME: 'admin'
          E2E_ADMIN_PASSWORD: 'test-password'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
